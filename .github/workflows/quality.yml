name: Qualidade e segurança
on:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Conferir arquivos do site
        shell: bash
        run: test -f index.html && test -f style.css && test -f script.js
